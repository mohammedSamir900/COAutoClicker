
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o COAutoClicker-full-project.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM settings
        run: |
          find . -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -not -path './.gradle/*' -exec sed -i \
            -e 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
            -e 's/1\.8/17/g' {} +

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: COAutoClicker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
concurrency:
  
